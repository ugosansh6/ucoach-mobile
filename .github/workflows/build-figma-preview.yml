name: Build Figma Preview

on:
  push:
    branches:
      - ui-figma-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web environment
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY" && exit 1)

      - name: Export Expo web preview
        run: npx expo export --platform web --output-dir dist

      - name: Inject Figma capture script into preview artifact only
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('dist/index.html')
          html = index.read_text()
          script = '<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>'
          if script not in html:
              html = html.replace('</head>', f'{script}\n</head>')
          index.write_text(html)
          Path('dist/404.html').write_text(html)
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugerod-figma-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
