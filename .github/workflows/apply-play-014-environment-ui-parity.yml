name: Apply PLAY-014 environment UI parity

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/play-014-environment-ui-parity.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply UI-only patch
        run: python .github/scripts/play014_environment_ui_parity.py
      - name: Verify UI parity scope
        run: |
          grep -q "canRegeneratePlanB = Boolean(workout?.sessionId) && !progressRecorded" app/workout/session.js
          grep -q "EnvironmentSwapOverlay variant=\"inline\"" app/workout/environment-session-core.js
          grep -q "Ma séance" app/workout/environment-session-core.js
          grep -q "Pourquoi ?" app/workout/environment-session-core.js
          grep -q "Ajuster" app/workout/environment-session-core.js
          grep -q "Réalisé · suivant" app/workout/environment-session-core.js
          grep -q "WodProtocolPlayerV3" src/components/workout/EnvironmentWodBlock.js
          grep -q "needsBuilderRuntimeSync" src/components/workout/EnvironmentSwapOverlay.js
      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-play014
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/session.js app/workout/environment-session-core.js src/components/workout/EnvironmentSwapOverlay.js src/components/workout/EnvironmentWodBlock.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(player): align environment session UI with focused player"
            git push origin HEAD:ux-navigation-coach-v1
          fi
