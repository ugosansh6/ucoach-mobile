name: DEV Reload Skill Guard

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/workflows/dev-test-reload-skill-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0
      - name: Patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/workout/session.js')
          s = p.read_text()
          old = "                    {hasSkill ? ("
          new = "                    {hasSkill && canChangeSkill ? ("
          if old not in s:
              raise SystemExit('skill option guard target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/dev-test-reload-skill-guard.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dev): hide skill reload after recorded progress"
          git push origin HEAD:ux-navigation-coach-v1
