name: Build staging baseline snapshot

on:
  push:
    branches:
      - staging-baseline-snapshot-20260818

permissions:
  contents: write

jobs:
  build-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build migration chunks
        shell: python
        run: |
          from pathlib import Path
          import json
          import subprocess

          cutoff = '20260811023133_phase_a_block_rules_allowed_exercise_counts_v2.sql'
          target_bytes = 180_000
          migration_dir = Path('supabase/migrations')
          output_dir = Path('staging_baseline_snapshot')
          output_dir.mkdir(exist_ok=True)
          for old in output_dir.glob('*'):
              old.unlink()

          files = sorted(p for p in migration_dir.glob('*.sql') if p.name > cutoff)
          chunks = []
          current = []
          current_size = 0

          for path in files:
              text = path.read_text(encoding='utf-8')
              payload = f"\n\n-- SOURCE MIGRATION: {path.name}\n{text}\n"
              size = len(payload.encode('utf-8'))
              if current and current_size + size > target_bytes:
                  chunks.append(current)
                  current = []
                  current_size = 0
              current.append((path.name, payload))
              current_size += size
          if current:
              chunks.append(current)

          manifest = {
              'source_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'cutoff_inclusive': cutoff,
              'migration_count': len(files),
              'chunk_count': len(chunks),
              'chunks': []
          }

          for i, chunk in enumerate(chunks, 1):
              name = f'chunk_{i:03d}.sql'
              content = ''.join(payload for _, payload in chunk)
              (output_dir / name).write_text(content, encoding='utf-8')
              manifest['chunks'].append({
                  'file': name,
                  'migrations': [filename for filename, _ in chunk],
                  'bytes': len(content.encode('utf-8'))
              })

          (output_dir / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

      - name: Commit snapshot bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging_baseline_snapshot
          git commit -m "chore(snapshot): build staging baseline chunks"
          git push origin HEAD
