name: Apply PLAY-015b new session context

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - '.github/play-015b-new-session-context.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply PLAY-015b patch
        run: python .github/scripts/play015b_new_session_clean_context.py

      - name: Verify scope
        run: |
          grep -q "protectedSessionExerciseIds: newSessionRequested ? \[\] : protectedSessionExerciseIds" app/workout/generating-themed.js
          git diff --check

      - name: Export Expo web
        run: npx expo export --platform web

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/generating-themed.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(session): clear old progress constraints for new session"
            git push origin HEAD:ux-navigation-coach-v1
          fi
