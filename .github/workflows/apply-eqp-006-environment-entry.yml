name: Apply EQP-006 environment entry

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/eqp-006-environment-entry.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python .github/scripts/eqp006_patch.py
      - name: Verify patch
        run: |
          grep -q "const { returnTo, environment } = useLocalSearchParams();" app/profile/equipment.js
          grep -q "useState(initialEnvironment)" app/profile/equipment.js
          grep -q "getUserEnvironmentEquipmentPreset(initialEnvironment)" app/profile/equipment.js
          grep -q "environment: environmentCode" src/workout/PreparationCheckinV4.js
          ! grep -q "Renseigner les charges aide UGEROD" app/profile/equipment.js
      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-eqp006
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/profile/equipment.js src/workout/PreparationCheckinV4.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(equipment): open profile on selected environment"
            git push origin HEAD:ux-navigation-coach-v1
          fi
