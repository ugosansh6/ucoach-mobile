name: Apply PLAY-003-004 focused player patch

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/player-patches/run-play-003-004.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1

      - name: Apply focused player patch
        run: node .github/player-patches/apply-play-003-004.mjs

      - name: Verify patch
        run: |
          git diff --check
          git diff -- app/workout/session-focused-core.js app/workout/session.js

      - name: Commit patch
        run: |
          if git diff --quiet -- app/workout/session-focused-core.js app/workout/session.js; then
            echo "No player changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/session-focused-core.js app/workout/session.js
          git commit -m "feat(player): rebuild focused shell and exercise actions"
          git push origin HEAD:ux-navigation-coach-v1
