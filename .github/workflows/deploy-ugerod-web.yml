name: Deploy UGEROD Web

on:
  push:
    branches:
      - ux-navigation-coach-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ugerod-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_WEB_BASE_URL: /ucoach-mobile
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web environment
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY" && exit 1)

      - name: Validate Composer structure editor
        run: |
          node scripts/qa-composer-architecture-editor.cjs
          node scripts/qa-composer-editor-wiring.cjs
          node scripts/qa-composer-presentation.cjs
          node scripts/qa-composer-distributions-ui.cjs
          node scripts/qa-composer-intent-matrix.cjs
          node scripts/qa-composer-selection.cjs
          node scripts/qa-composer-wod-selection.cjs
          node scripts/qa-composer-preferences.cjs
          node scripts/qa-composer-preferences-ui.cjs
          node scripts/qa-composer-shared-skill.cjs
          node scripts/qa-composer-outdoor.cjs
          node scripts/qa-composer-frame.cjs
          node scripts/qa-week-presentation.cjs
          node scripts/qa-routines.cjs
          node scripts/qa-composer-player-progress.cjs
          node scripts/qa-composer-progress-service.cjs
          node scripts/qa-exercise-catalogue.cjs
          node scripts/qa-exercise-names.cjs
          node scripts/qa-composer-manual-dose.cjs
          node scripts/qa-composer-recap-ui.cjs
          node scripts/qa-personal-workout-models.cjs
          node scripts/qa-composer-tabata-runtime.cjs
          node scripts/qa-wod-protocol-audit.cjs
          node scripts/qa-composer-wod-runtime.cjs
      - name: Export Expo web app
        run: npx expo export --platform web --output-dir dist

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
