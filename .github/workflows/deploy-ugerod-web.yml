name: Deploy UGEROD Web

on:
  push:
    branches:
      - ux-navigation-coach-v1
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ugerod-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_WEB_BASE_URL: /ucoach-mobile
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted swap UI correction
        shell: bash
        run: |
          python scripts/patch-swap-reasons.py
          if git diff --quiet; then
            echo "No swap patch to commit"
          else
            git config user.name "UGEROD Bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/workout/session.js
            git commit -m "fix(workout): move adaptation reasons to swap action"
            git push origin HEAD:ux-navigation-coach-v1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web environment
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY" && exit 1)

      - name: Export Expo web app
        run: npx expo export --platform web --output-dir dist

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
