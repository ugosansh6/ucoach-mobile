name: PWA QA Temp

on:
  push:
    branches:
      - ux-navigation-coach-v1

jobs:
  expo-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_WEB_BASE_URL: /ucoach-mobile
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: qa-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist-qa
      - run: test -f dist-qa/manifest.json
      - run: test -f dist-qa/ugerod-icon.svg
      - run: grep -q '/ucoach-mobile' dist-qa/index.html
