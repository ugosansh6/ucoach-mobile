name: Apply EQP-004b equipment category hub

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - '.github/eqp-004b-category-hub.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply EQP-004 patch
        run: python .github/scripts/eqp004_category_hub.py

      - name: Verify category hub
        run: |
          grep -q "CHOISIS UNE CATÉGORIE" app/profile/equipment.js
          grep -q "categoryGrid" app/profile/equipment.js
          grep -q "equipment.displayName" app/profile/equipment.js
          grep -q "ENVIRONMENT_EXCLUDED_EQUIPMENT" src/constants/equipmentUxCategories.js
          grep -q "E36: 'Tirage vertical'" src/constants/equipmentUxCategories.js

      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-eqp004

      - name: Commit EQP-004
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/profile/equipment.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(equipment): open categories before equipment list"
            git push origin HEAD:ux-navigation-coach-v1
          fi
