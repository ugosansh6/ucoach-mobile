name: Apply W11.4b week session open

on:
  push:
    paths:
      - '.github/player-patches/run-w11-4b-week-session-open.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Apply W11.4b patch
        run: node .github/player-patches/apply-w11-4b-week-session-open.mjs
      - name: Verify and export web
        run: |
          grep -q "reloadWorkoutSession" 'app/(tabs)/planning.js'
          grep -q "REPRENDRE LA SÉANCE" 'app/(tabs)/planning.js'
          grep -q "OUVRIR LA SÉANCE" 'app/(tabs)/planning.js'
          if grep -q 'router.push(`/workout/${item.sessionId}`)' 'app/(tabs)/planning.js'; then exit 1; fi
          npx expo export --platform web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/planning.js'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(week): open built sessions through real workout shell"
            git push origin ux-navigation-coach-v1
          fi
