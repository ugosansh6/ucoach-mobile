name: Apply NAV-002 single resume CTA

on:
  push:
    branches: [ux-navigation-coach-v1]
    paths:
      - '.github/player-patches/run-nav-002-single-resume-cta.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply NAV-002 patch
        run: node .github/player-patches/apply-nav-002-single-resume-cta.mjs

      - name: Verify CTA contract and export web
        run: |
          grep -q "Reprendre sa séance" src/workout/PreparationCheckinV4.js
          ! grep -q "Reprends exactement là où tu t’es arrêté" src/workout/PreparationCheckinV4.js
          ! grep -q "styles.resumePanel" src/workout/PreparationCheckinV4.js
          npx expo export --platform web --output-dir dist

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workout/PreparationCheckinV4.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(nav): use single resume session CTA"
          git push origin ux-navigation-coach-v1
