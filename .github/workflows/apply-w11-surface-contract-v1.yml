name: Apply W11 surface contract v1

on:
  push:
    paths:
      - '.github/player-patches/run-w11-surface-contract-v1.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Apply surface contract patch
        run: python .github/player-patches/apply-w11-surface-contract-v1.py
      - name: Verify and export web
        run: |
          grep -q "contextItemsNeverRenderAsSessions" src/services/weeklyPlanService.js
          grep -q "Ce jour n’est plus disponible" 'app/(tabs)/planning.js'
          grep -q "contract?.planningSlotCount" 'app/(tabs)/planning.js'
          npx expo export --platform web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/weeklyPlanService.js 'app/(tabs)/planning.js'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(week): split context-only items from visible week"
            git push origin ux-navigation-coach-v1
          fi
