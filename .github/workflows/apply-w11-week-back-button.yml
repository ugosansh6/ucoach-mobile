name: Apply W11 week back button

on:
  push:
    paths:
      - '.github/player-patches/run-w11-week-back-button.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Apply Ma semaine back button patch
        run: node .github/player-patches/apply-w11-week-back-button.mjs
      - name: Verify and export web
        run: |
          grep -q 'accessibilityLabel="Retour"' 'app/(tabs)/planning.js'
          grep -q 'Ionicons name="arrow-back"' 'app/(tabs)/planning.js'
          grep -q "router.canGoBack() ? router.back() : router.replace('/(tabs)')" 'app/(tabs)/planning.js'
          npx expo export --platform web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/planning.js'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(week): add back navigation to Ma semaine"
            git push origin ux-navigation-coach-v1
          fi
