name: Apply W11 week raccord UI

on:
  push:
    paths:
      - '.github/player-patches/run-w11-week-raccord-ui.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Apply week raccord patch
        run: python .github/player-patches/apply-w11-week-raccord-ui.py
      - name: Verify and export web
        run: |
          grep -q "Journée passée" 'app/(tabs)/planning.js'
          grep -q "Choisis un jour libre pour ajouter une 4e ou 5e séance" 'app/(tabs)/planning.js'
          grep -q "planningSlotCount" 'app/(tabs)/planning.js'
          npx expo export --platform web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/planning.js'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(week): align past slots and extra-session picker"
            git push origin ux-navigation-coach-v1
          fi
