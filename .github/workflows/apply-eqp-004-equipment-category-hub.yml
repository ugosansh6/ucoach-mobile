name: Apply EQP-004 equipment category hub

on:
  push:
    branches: [ux-navigation-coach-v1]
    paths:
      - '.github/eqp-004-category-hub.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply EQP-004 category hub
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/profile/equipment.js')
          text = path.read_text(encoding='utf-8')

          old = """  const resolvedActiveCategory =
    categoryOptions.some((section) => section.key === activeCategory)
      ? activeCategory
      : categoryOptions[0]?.key ?? null;

  const environmentCatalog = useMemo(
    () => equipmentSections.flatMap((section) => section.items),
    [equipmentSections]
  );

  const visibleCatalog = useMemo(() => {
    const normalizedQuery = normalizeSearchValue(searchQuery.trim());
    const source = normalizedQuery
      ? environmentCatalog
      : categoryOptions.find((section) => section.key === resolvedActiveCategory)?.items ?? [];

    if (!normalizedQuery) return source;

    return source.filter((equipment) =>
      normalizeSearchValue(
        [equipment.name, equipment.category, equipment.description, equipment.uxGroup]
          .filter(Boolean)
          .join(' ')
      ).includes(normalizedQuery)
    );
  }, [categoryOptions, environmentCatalog, resolvedActiveCategory, searchQuery]);
"""
          new = """  const resolvedActiveCategory =
    categoryOptions.some((section) => section.key === activeCategory)
      ? activeCategory
      : null;

  const activeCategoryOption = useMemo(
    () => categoryOptions.find((section) => section.key === resolvedActiveCategory) ?? null,
    [categoryOptions, resolvedActiveCategory]
  );

  const visibleCatalog = useMemo(() => {
    const source = activeCategoryOption?.items ?? [];
    const normalizedQuery = normalizeSearchValue(searchQuery.trim());

    if (!normalizedQuery) return source;

    return source.filter((equipment) =>
      normalizeSearchValue(
        [
          equipment.displayName,
          equipment.name,
          equipment.category,
          equipment.description,
          equipment.uxGroup,
        ]
          .filter(Boolean)
          .join(' ')
      ).includes(normalizedQuery)
    );
  }, [activeCategoryOption, searchQuery]);
"""
          if old not in text:
              raise SystemExit('Derived category block not found')
          text = text.replace(old, new, 1)

          start_marker = '            <View style={styles.catalogTools}>'
          end_marker = '            {/* INVENTAIRE */}'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''            <View style={styles.catalogTools}>
              <ScrollView
                horizontal
                showsHorizontalScrollIndicator={false}
                contentContainerStyle={styles.locationTabs}
              >
                {PROFILE_ENVIRONMENTS.map((location) => {
                  const selected = activeEnvironment === location.key;

                  return (
                    <Pressable
                      key={location.key}
                      onPress={() => selectProfileEnvironment(location.key)}
                      style={[
                        styles.locationTab,
                        selected && styles.locationTabSelected,
                      ]}
                    >
                      <Ionicons
                        name={location.icon}
                        size={16}
                        color={selected ? colors.brandWhite : colors.textSecondary}
                      />
                      <Text
                        style={[
                          styles.locationTabText,
                          selected && styles.locationTabTextSelected,
                        ]}
                      >
                        {location.label}
                      </Text>
                    </Pressable>
                  );
                })}
              </ScrollView>

              {!resolvedActiveCategory ? (
                <>
                  <View style={styles.categoryIntroRow}>
                    <View style={styles.categoryIntroCopy}>
                      <Text style={styles.categoryIntroTitle}>CHOISIS UNE CATÉGORIE</Text>
                      <Text style={styles.categoryIntroText}>
                        {selectedEquipmentCount} équipement{selectedEquipmentCount > 1 ? 's' : ''} sélectionné{selectedEquipmentCount > 1 ? 's' : ''} pour {activeEnvironmentLabel.toLowerCase()}.
                      </Text>
                    </View>
                  </View>

                  <View style={styles.categoryGrid}>
                    {categoryOptions.map((category) => (
                      <Pressable
                        key={category.key}
                        onPress={() => {
                          setSearchQuery('');
                          setActiveCategory(category.key);
                        }}
                        style={({ pressed }) => [
                          styles.categoryCard,
                          pressed && styles.categoryCardPressed,
                        ]}
                      >
                        <View style={styles.categoryHeroIcon}>
                          <Ionicons
                            name={category.icon}
                            size={32}
                            color={BRAND_KAKI}
                          />
                        </View>

                        <Text style={styles.categoryCardLabel}>
                          {category.label.toUpperCase()}
                        </Text>

                        <Text numberOfLines={2} style={styles.categoryCardDescription}>
                          {category.description}
                        </Text>

                        <View style={styles.categoryCardFooter}>
                          <Text style={styles.categoryCardCount}>
                            {category.selectedCount}/{category.items.length} sélectionné{category.selectedCount > 1 ? 's' : ''}
                          </Text>
                          <Ionicons
                            name="arrow-forward"
                            size={18}
                            color={BRAND_ORANGE}
                          />
                        </View>
                      </Pressable>
                    ))}
                  </View>
                </>
              ) : (
                <>
                  <Pressable
                    onPress={() => {
                      setSearchQuery('');
                      setActiveCategory(null);
                    }}
                    style={({ pressed }) => [
                      styles.categoryBackRow,
                      pressed && styles.pressed,
                    ]}
                  >
                    <Ionicons name="arrow-back" size={18} color={BRAND_KAKI} />
                    <Text style={styles.categoryBackText}>TOUTES LES CATÉGORIES</Text>
                  </Pressable>

                  <View style={styles.activeCategoryHero}>
                    <View style={styles.activeCategoryIcon}>
                      <Ionicons
                        name={activeCategoryOption?.icon ?? 'grid-outline'}
                        size={28}
                        color={colors.brandWhite}
                      />
                    </View>
                    <View style={styles.activeCategoryCopy}>
                      <Text style={styles.activeCategoryTitle}>
                        {String(activeCategoryOption?.label ?? '').toUpperCase()}
                      </Text>
                      <Text style={styles.activeCategoryDescription}>
                        {activeCategoryOption?.description}
                      </Text>
                    </View>
                    <Text style={styles.activeCategoryCount}>
                      {activeCategoryOption?.selectedCount ?? 0}/{activeCategoryOption?.items?.length ?? 0}
                    </Text>
                  </View>

                  <View style={styles.searchShell}>
                    <Ionicons
                      name="search-outline"
                      size={19}
                      color={colors.textMuted}
                    />
                    <TextInput
                      value={searchQuery}
                      onChangeText={setSearchQuery}
                      placeholder={`Rechercher dans ${String(activeCategoryOption?.label ?? '').toLowerCase()}…`}
                      placeholderTextColor={colors.textMuted}
                      autoCapitalize="none"
                      autoCorrect={false}
                      returnKeyType="search"
                      style={styles.searchInput}
                    />
                    {searchQuery.length > 0 && (
                      <Pressable onPress={() => setSearchQuery('')} hitSlop={8}>
                        <Ionicons
                          name="close-circle"
                          size={19}
                          color={colors.textMuted}
                        />
                      </Pressable>
                    )}
                  </View>

                  <View style={styles.catalogSummaryRow}>
                    <Text style={styles.catalogSummaryText}>
                      {searchQuery.length > 0
                        ? `${visibleCatalog.length} RÉSULTAT${visibleCatalog.length > 1 ? 'S' : ''}`
                        : `${visibleCatalog.length} ÉQUIPEMENT${visibleCatalog.length > 1 ? 'S' : ''}`}
                    </Text>
                    <Text style={styles.catalogSummarySelected}>
                      {activeCategoryOption?.selectedCount ?? 0} SÉLECTIONNÉ{(activeCategoryOption?.selectedCount ?? 0) > 1 ? 'S' : ''}
                    </Text>
                  </View>
                </>
              )}
            </View>

'''
          text = text[:start] + replacement + text[end:]

          # Bodyweight is implicit on this profile screen; do not pollute category lists.
          body_start = text.index('              <View\n                style={[\n                  styles.equipmentCard,\n                  styles.bodyweightCard,')
          body_end = text.index('              {visibleCatalog.map(', body_start)
          text = text[:body_start] + text[body_end:]

          text = text.replace(
              '{visibleCatalog.length === 0 && (',
              '{resolvedActiveCategory && visibleCatalog.length === 0 && (',
              1,
          )

          text = text.replace(
              "                            {String(\n                              equipment.name ??\n                                ''\n                            ).toUpperCase()}",
              "                            {String(\n                              equipment.displayName ??\n                                equipment.name ??\n                                ''\n                            ).toUpperCase()}",
              1,
          )

          style_anchor = """  categoryTabs: {
    gap: 10,
    paddingRight: 8,
  },
"""
          if style_anchor not in text:
              raise SystemExit('Category style anchor not found')

          new_styles = """  categoryIntroRow: {
    marginTop: 4,
    flexDirection: 'row',
    alignItems: 'center',
    justifyContent: 'space-between',
  },

  categoryIntroCopy: {
    flex: 1,
  },

  categoryIntroTitle: {
    fontFamily: 'BebasNeue_400Regular',
    fontSize: 24,
    lineHeight: 27,
    letterSpacing: 1.1,
    color: colors.textPrimary,
  },

  categoryIntroText: {
    marginTop: 3,
    fontFamily: 'Oswald_400Regular',
    fontSize: 12,
    lineHeight: 18,
    color: colors.textSecondary,
  },

  categoryGrid: {
    flexDirection: 'row',
    flexWrap: 'wrap',
    gap: 12,
  },

  categoryCard: {
    width: '48%',
    minHeight: 168,
    padding: 15,
    borderRadius: 20,
    borderWidth: 1,
    borderColor: isDark ? 'rgba(255,255,255,0.10)' : colors.border,
    backgroundColor: isDark ? 'rgba(17,21,26,0.92)' : colors.surfaceElevated,
    shadowColor: colors.shadow,
    shadowOpacity: isDark ? 0.16 : 0.06,
    shadowRadius: 12,
    shadowOffset: { width: 0, height: 5 },
    elevation: 2,
  },

  categoryCardPressed: {
    opacity: 0.84,
    transform: [{ scale: 0.985 }],
  },

  categoryHeroIcon: {
    width: 52,
    height: 52,
    borderRadius: 17,
    alignItems: 'center',
    justifyContent: 'center',
    backgroundColor: colors.accentSoft,
    marginBottom: 13,
  },

  categoryCardLabel: {
    fontFamily: 'Oswald_700Bold',
    fontSize: 17,
    lineHeight: 22,
    letterSpacing: 0.45,
    color: colors.textPrimary,
  },

  categoryCardDescription: {
    marginTop: 4,
    minHeight: 34,
    fontFamily: 'Oswald_400Regular',
    fontSize: 11,
    lineHeight: 16,
    color: colors.textSecondary,
  },

  categoryCardFooter: {
    marginTop: 'auto',
    paddingTop: 10,
    flexDirection: 'row',
    alignItems: 'center',
    justifyContent: 'space-between',
  },

  categoryCardCount: {
    flexShrink: 1,
    fontFamily: 'Oswald_600SemiBold',
    fontSize: 10,
    lineHeight: 14,
    color: BRAND_ORANGE,
  },

  categoryBackRow: {
    alignSelf: 'flex-start',
    minHeight: 38,
    flexDirection: 'row',
    alignItems: 'center',
    gap: 7,
  },

  categoryBackText: {
    fontFamily: 'Oswald_700Bold',
    fontSize: 10,
    letterSpacing: 0.6,
    color: BRAND_KAKI,
  },

  activeCategoryHero: {
    minHeight: 92,
    padding: 14,
    borderRadius: 18,
    borderWidth: 1,
    borderColor: 'rgba(94,102,51,0.28)',
    backgroundColor: colors.accentSoft,
    flexDirection: 'row',
    alignItems: 'center',
    gap: 12,
  },

  activeCategoryIcon: {
    width: 48,
    height: 48,
    borderRadius: 16,
    backgroundColor: BRAND_KAKI,
    alignItems: 'center',
    justifyContent: 'center',
  },

  activeCategoryCopy: {
    flex: 1,
  },

  activeCategoryTitle: {
    fontFamily: 'Oswald_700Bold',
    fontSize: 18,
    lineHeight: 23,
    color: colors.textPrimary,
  },

  activeCategoryDescription: {
    marginTop: 2,
    fontFamily: 'Oswald_400Regular',
    fontSize: 11,
    lineHeight: 16,
    color: colors.textSecondary,
  },

  activeCategoryCount: {
    fontFamily: 'BebasNeue_400Regular',
    fontSize: 25,
    lineHeight: 28,
    color: BRAND_ORANGE,
  },

"""
          text = text.replace(style_anchor, new_styles + style_anchor, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify category hub and environment policy
        run: |
          grep -q "CHOISIS UNE CATÉGORIE" app/profile/equipment.js
          grep -q "categoryGrid" app/profile/equipment.js
          grep -q "equipment.displayName" app/profile/equipment.js
          grep -q "ENVIRONMENT_EXCLUDED_EQUIPMENT" src/constants/equipmentUxCategories.js
          grep -q "E36: 'Tirage vertical'" src/constants/equipmentUxCategories.js
          ! grep -q "categoryOptions\[0\]?.key" app/profile/equipment.js

      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-eqp004

      - name: Commit EQP-004
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/profile/equipment.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(equipment): open categories before equipment list"
            git push origin HEAD:ux-navigation-coach-v1
          fi
