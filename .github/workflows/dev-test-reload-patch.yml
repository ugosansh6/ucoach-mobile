name: DEV Player Reload Patch

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/workflows/dev-test-reload-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0

      - name: Patch session testing loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/workout/session.js')
          s = p.read_text()

          s = s.replace(
              "import {\n  changeWholeWorkoutPlan,\n  changeWorkoutSkillPlan,\n} from '../../src/services/skillPlanService';\n\nfunction normalizeBlock(value) {",
              "import {\n  changeWholeWorkoutPlan,\n  changeWorkoutSkillPlan,\n} from '../../src/services/skillPlanService';\n\nconst DEV_TEST_RELOAD = process.env.EXPO_PUBLIC_APP_ENV === 'development';\n\nfunction normalizeBlock(value) {"
          )

          s = s.replace(
              "  // Plan B reste disponible tant qu'aucun résultat d'exécution n'a été enregistré.\n  // On ne dépend pas du flag sessionStarted : il peut être posé avant le premier effort.\n  const canRegeneratePlanB =\n    Boolean(workout?.sessionId) && !isEnvironmentSession && !progressRecorded;\n  const showPlanBEntry = Boolean(workout?.sessionId) && !isEnvironmentSession;\n  const canChangeSkill = canRegeneratePlanB && hasSkill;",
              "  // En usage normal, Plan B reste limité à l'avant-effort.\n  // Sur le build DEV uniquement, on garde une boucle de recharge pour tester le Player\n  // même après avoir avancé dans la séance. Le backend DEV protège les résultats persistés.\n  const canRegeneratePlanB =\n    Boolean(workout?.sessionId) &&\n    !isEnvironmentSession &&\n    (!progressRecorded || DEV_TEST_RELOAD);\n  const showPlanBEntry = Boolean(workout?.sessionId) && !isEnvironmentSession;\n  const canChangeSkill =\n    Boolean(workout?.sessionId) && !isEnvironmentSession && !progressRecorded && hasSkill;"
          )

          s = s.replace(
              "{canRegeneratePlanB ? 'Envie d’autre chose ?' : 'Ta séance a déjà commencé.'}",
              "{canRegeneratePlanB\n                      ? DEV_TEST_RELOAD && progressRecorded\n                        ? 'Recharger pour continuer les tests ?'\n                        : 'Envie d’autre chose ?'\n                      : 'Ta séance a déjà commencé.'}"
          )

          s = s.replace(
              "                  <Text style={styles.explanation}>\n                    Tu peux encore changer de proposition : aucun résultat d’exercice n’a été enregistré.\n                  </Text>",
              "                  <Text style={styles.explanation}>\n                    {DEV_TEST_RELOAD && progressRecorded\n                      ? 'Mode développement : tu peux recharger une nouvelle séance pour continuer les tests. Les résultats déjà persistés restent protégés.'\n                      : 'Tu peux encore changer de proposition : aucun résultat d’exercice n’a été enregistré.'}\n                  </Text>"
          )

          s = s.replace(
              "                    <PlanBOption\n                      title=\"Une autre séance\"\n                      description=\"Même durée, matériel et forme du jour. UGEROD reconstruit une proposition différente.\"",
              "                    <PlanBOption\n                      title={DEV_TEST_RELOAD && progressRecorded ? 'Recharger une séance de test' : 'Une autre séance'}\n                      description={\n                        DEV_TEST_RELOAD && progressRecorded\n                          ? 'La session de test en cours est abandonnée proprement, puis UGEROD recharge une nouvelle proposition avec le même check-in.'\n                          : 'Même durée, matériel et forme du jour. UGEROD reconstruit une proposition différente.'\n                      }"
          )

          if "const DEV_TEST_RELOAD" not in s:
              raise SystemExit('DEV_TEST_RELOAD insertion failed')
          if "Recharger une séance de test" not in s:
              raise SystemExit('Plan B test label insertion failed')
          if "(!progressRecorded || DEV_TEST_RELOAD)" not in s:
              raise SystemExit('Plan B availability patch failed')

          p.write_text(s)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/dev-test-reload-patch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(dev): restore workout reload loop for player testing"
          git push origin HEAD:ux-navigation-coach-v1
