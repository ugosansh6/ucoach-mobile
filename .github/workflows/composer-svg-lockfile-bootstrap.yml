name: Prepare muscle SVG dependency lockfile

on:
  push:
    branches:
      - feat/composer-muscle-map-20261027

permissions:
  contents: write

jobs:
  update-lockfile:
    if: "!contains(github.event.head_commit.message, '[svg-lockfile]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin Expo SDK 54 SVG dependency
        run: npm install react-native-svg@15.12.1 --save-exact --package-lock-only --ignore-scripts
      - name: Commit deterministic package files to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): pin react-native-svg for Expo 54 [svg-lockfile]"
            git push origin HEAD:feat/composer-muscle-map-20261027
          fi
