name: Apply PERF-003 format options edge

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/player-patches/run-perf-003-format-options-edge.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply PERF-003 patch
        run: node .github/player-patches/apply-perf-003-format-options-edge.mjs

      - name: Verify and export web
        run: |
          git diff --check
          grep -n "action: 'OPTIONS'\|timingMs" src/services/workoutService.js
          npx expo export --platform web --output-dir dist-perf-003

      - name: Commit patch
        run: |
          if git diff --quiet -- src/services/workoutService.js; then
            echo "No PERF-003 changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/workoutService.js
          git commit -m "perf(format): load WOD options through parallel edge path"
          git push origin HEAD:ux-navigation-coach-v1
