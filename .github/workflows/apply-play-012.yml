name: Apply PLAY-012 session copy patch

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/player-patches/run-play-012.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1

      - name: Apply PLAY-012 patch
        run: node .github/player-patches/apply-play-012.mjs

      - name: Verify patch
        run: |
          git diff --check
          git diff -- app/workout/session-focused-core.js

      - name: Commit patch
        run: |
          if git diff --quiet -- app/workout/session-focused-core.js; then
            echo "No PLAY-012 changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/session-focused-core.js
          git commit -m "fix(player): clarify Skill prescription and objective"
          git push origin HEAD:ux-navigation-coach-v1
