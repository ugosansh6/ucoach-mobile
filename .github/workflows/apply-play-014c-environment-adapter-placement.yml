name: Apply PLAY-014c environment adapter placement

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/play-014c-environment-adapter-placement.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply adapter placement patch
        run: python .github/scripts/play014c_environment_adapter_placement.py
      - name: Verify adapter placement
        run: |
          grep -q "targetExercise = null" src/components/workout/EnvironmentSwapOverlay.js
          grep -q "targetExercise={exercise}" app/workout/environment-session-core.js
          grep -q "targetExercise={activeExercise}" app/workout/environment-session-core.js
          ! grep -q 'EnvironmentSwapOverlay variant="inline" />' app/workout/environment-session-core.js
      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-play014c
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/environment-session-core.js src/components/workout/EnvironmentSwapOverlay.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(player): place environment adapter with exercises"
            git push origin HEAD:ux-navigation-coach-v1
          fi
