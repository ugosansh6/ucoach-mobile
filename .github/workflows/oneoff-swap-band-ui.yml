name: One-off swap and band UI fixes

on:
  push:
    branches:
      - ux-navigation-coach-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0

      - name: Apply guarded patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          session_path = Path('app/workout/session.js')
          text = session_path.read_text()

          old = """  const [\n    swapSeenExerciseIds,\n    setSwapSeenExerciseIds,\n  ] = useState({});\n\n  const [\n    formatModalVisible,\n"""
          new = """  const [\n    swapSeenExerciseIds,\n    setSwapSeenExerciseIds,\n  ] = useState({});\n\n  const [\n    swapUndoDisplayNameStacks,\n    setSwapUndoDisplayNameStacks,\n  ] = useState({});\n\n  const [\n    formatModalVisible,\n"""
          assert text.count(old) == 1, 'swap state insertion point mismatch'
          text = text.replace(old, new, 1)

          old = """      const stillAdaptedAfterUndo =\n        undo\n          ? availabilityAfter?.items?.[\n              instanceId\n            ]?.can_undo === true\n          : true;\n\n"""
          assert text.count(old) == 1, 'legacy adapted-after-undo block mismatch'
          text = text.replace(old, '', 1)

          old = """                  status:\n                    undo &&\n                    !stillAdaptedAfterUndo\n                      ? 'pending'\n                      : 'adapted',\n                  adaptationSource:\n                    undo &&\n                    !stillAdaptedAfterUndo\n                      ? null\n                      : undo\n                        ? 'swap-undo'\n                        : reason,\n"""
          new = """                  status: 'pending',\n                  adaptationSource: null,\n                  swapReason:\n                    undo\n                      ? null\n                      : reason,\n"""
          assert text.count(old) == 1, 'swap execution-status block mismatch'
          text = text.replace(old, new, 1)

          marker = """      setSwapAvailability(\n        availabilityAfter?.items ?? {}\n      );\n"""
          insert = """      setSwapUndoDisplayNameStacks(\n        (current) => {\n          const stack = [\n            ...(current[instanceId] ?? []),\n          ];\n\n          if (undo) {\n            stack.pop();\n          } else if (exercise?.name) {\n            stack.push(exercise.name);\n          }\n\n          return {\n            ...current,\n            [instanceId]: stack,\n          };\n        }\n      );\n\n""" + marker
          assert text.count(marker) == 1, 'swap availability update marker mismatch'
          text = text.replace(marker, insert, 1)

          marker = """        error={swapError}\n        onClose={\n          closeSwapActions\n        }\n"""
          insert = """        error={swapError}\n        undoDisplayName={\n          swapActionExercise?.exercise\n            ?.sessionExerciseId\n            ? (swapUndoDisplayNameStacks[\n                swapActionExercise\n                  .exercise\n                  .sessionExerciseId\n              ] ?? []).slice(-1)[0] ??\n              null\n            : null\n        }\n        onClose={\n          closeSwapActions\n        }\n"""
          assert text.count(marker) == 1, 'swap modal prop marker mismatch'
          text = text.replace(marker, insert, 1)

          old = """function SwapDirectionModal({\n  visible,\n  exercise,\n  availability,\n  loading,\n  error,\n  onClose,\n  onSelect,\n}) {\n"""
          new = """function SwapDirectionModal({\n  visible,\n  exercise,\n  availability,\n  loading,\n  error,\n  undoDisplayName,\n  onClose,\n  onSelect,\n}) {\n"""
          assert text.count(old) == 1, 'SwapDirectionModal signature mismatch'
          text = text.replace(old, new, 1)

          old = """  const undoLabel =\n    availability?.undo_exercise_name\n      ? `REVENIR À ${String(\n          availability.undo_exercise_name\n        ).toUpperCase()}`\n      : 'REVENIR AU PRÉCÉDENT';\n"""
          new = """  const undoLabel =\n    undoDisplayName\n      ? `REVENIR À ${String(\n          undoDisplayName\n        ).toUpperCase()}`\n      : availability?.undo_exercise_name\n        ? `REVENIR À ${String(\n            availability.undo_exercise_name\n          ).toUpperCase()}`\n        : 'REVENIR AU PRÉCÉDENT';\n"""
          assert text.count(old) == 1, 'undo label block mismatch'
          text = text.replace(old, new, 1)

          assert "stillAdaptedAfterUndo" not in text
          assert "status: 'pending',\n                  adaptationSource: null" in text
          session_path.write_text(text)

          service_path = Path('src/services/workoutService.js')
          service = service_path.read_text()
          load_block = """  if (load) {\n    const scope =\n      prescription.load_scope ===\n      'per_implement'\n        ? ' / haltère'\n        : '';\n\n    pieces.push(\n      `${load} kg${scope}`\n    );\n  }\n"""
          band_block = load_block + """\n  const bandResistance =\n    prescription.band_resistance_label;\n\n  if (bandResistance) {\n    const bandPrefix =\n      prescription\n        .band_resistance_semantics ===\n      'assistance'\n        ? 'Assistance'\n        : 'Résistance';\n\n    pieces.push(\n      `${bandPrefix} ${String(\n        bandResistance\n      ).toLocaleLowerCase('fr-FR')}`\n    );\n  }\n"""
          assert service.count(load_block) == 2, f'expected 2 load blocks, found {service.count(load_block)}'
          service = service.replace(load_block, band_block)
          assert service.count('band_resistance_label') == 2
          service_path.write_text(service)
          PY

      - name: Validate syntax-level invariants
        shell: bash
        run: |
          grep -q "swapUndoDisplayNameStacks" app/workout/session.js
          grep -q "status: 'pending'" app/workout/session.js
          ! grep -q "stillAdaptedAfterUndo" app/workout/session.js
          test "$(grep -c "band_resistance_label" src/services/workoutService.js)" -eq 2

      - name: Commit fixes and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-swap-band-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/session.js src/services/workoutService.js .github/workflows/oneoff-swap-band-ui.yml
          git commit -m "fix(workout): separate swap from execution status"
          git push origin HEAD:ux-navigation-coach-v1
