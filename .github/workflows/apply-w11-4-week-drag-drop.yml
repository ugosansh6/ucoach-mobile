name: Apply W11.4 week drag drop

on:
  push:
    paths:
      - '.github/player-patches/run-w11-4-week-drag-drop.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Apply W11.4 patch
        run: node .github/player-patches/apply-w11-4-week-drag-drop.mjs
      - name: Verify W11.4 contract and export web
        run: |
          grep -q "moveWeekPlanItem" "app/(tabs)/planning.js"
          grep -q "PanResponder" "app/(tabs)/planning.js"
          grep -q "DÉPOSE SUR UN JOUR" "app/(tabs)/planning.js"
          grep -q "Appui long sur une séance" "app/(tabs)/planning.js"
          grep -q "collision" "app/(tabs)/planning.js"
          npx expo export --platform web
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/(tabs)/planning.js"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(week): add W11.4 long-press drag and drop"
            git push origin ux-navigation-coach-v1
          fi
