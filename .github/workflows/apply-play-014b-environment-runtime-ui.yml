name: Apply PLAY-014b environment runtime UI

on:
  push:
    branches:
      - ux-navigation-coach-v1
    paths:
      - .github/play-014b-environment-runtime-ui.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-navigation-coach-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply UI-only environment patch
        run: python .github/scripts/play014b_environment_runtime_ui.py
      - name: Verify scope
        run: |
          grep -q "usesSpecializedEnvironmentRuntime" app/workout/session.js
          grep -q "EnvironmentSessionCore" app/workout/session.js
          grep -q "EnvironmentSwapOverlay variant=\"inline\"" app/workout/environment-session-core.js
          grep -q "Réalisé · suivant" app/workout/environment-session-core.js
          grep -q "Ma séance" app/workout/environment-session-core.js
          grep -q "Pourquoi ?" app/workout/environment-session-core.js
          grep -q "Ajuster" app/workout/environment-session-core.js
          grep -q "needsBuilderRuntimeSync" src/components/workout/EnvironmentSwapOverlay.js
          grep -q "const swapExercise = current?.pendingExercises?.\[0\]" src/components/workout/EnvironmentSwapOverlay.js
      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-play014b
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workout/environment-session-core.js src/components/workout/EnvironmentSwapOverlay.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(player): align environment runtime UI"
            git push origin HEAD:ux-navigation-coach-v1
          fi
