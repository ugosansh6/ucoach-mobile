name: Composer default exercise selection QA

on:
  pull_request:
    paths:
      - 'src/workout/WeekComposerV7.js'
      - 'src/services/composerService.js'
      - 'scripts/qa-composer-selection.cjs'
      - 'scripts/qa-session-quick-evolutions.cjs'
      - 'scripts/qa-wod-hold-timer.cjs'
      - 'app/workout/session.js'
      - 'app/workout/session-focused-core.js'
      - 'src/components/workout/WodProtocolPlayerV3.js'
      - 'scripts/qa-composer-shared-engine.cjs'
      - 'src/services/workoutGenerationService.js'
      - 'supabase/migrations/*composer*'
      - '.github/workflows/composer-default-selection-qa.yml'

permissions:
  contents: read

jobs:
  deterministic-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests for exercise selection and budget
        run: node scripts/qa-composer-selection.cjs
      - name: Shared C2/C4 engine contract and safety guards
        run: node scripts/qa-composer-shared-engine.cjs
      - name: Strength Player routing and Warm-up round regression
        run: node scripts/qa-session-quick-evolutions.cjs
      - name: Timed movement hold countdown regression
        run: node scripts/qa-wod-hold-timer.cjs
